plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.4'
	id 'io.spring.dependency-management' version '1.1.4'
}

jar.enabled = false
bootJar.enabled = false

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

subprojects{
	group = 'com.gaduationproject'
	version = '0.0.1-SNAPSHOT'
	sourceCompatibility = '17'


	apply plugin: 'java'
	apply plugin: 'java-library'
	apply plugin: 'idea'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'

	configurations {
		compileOnly {
			extendsFrom annotationProcessor
		}
	}

	repositories {
		mavenCentral()
	}

	dependencies {
		implementation 'org.springframework.boot:spring-boot-starter-web'
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}


project(":module-common") {
	bootJar.enabled = false
	jar.enabled = true

	dependencies {

	}

}



project(":module-admin") {
	version '0.0.1'
	dependencies {

		implementation project(path: ':module-common')
		implementation project(path: ':module-domain')
		testImplementation platform('org.junit:junit-bom:5.9.1')
		testImplementation 'org.junit.jupiter:junit-jupiter'
		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		implementation project(path: ':module-external')
		//swagger
		implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'
		//security
		implementation "org.springframework.boot:spring-boot-starter-security"
		testImplementation 'org.springframework.security:spring-security-test'
		implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.11.2'
		runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.11.2'
		runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.11.2'
	}

	jar.enabled = false
	bootJar.enabled = true

}

project(":module-external") {


	dependencies {

		implementation project(path: ':module-common')
		implementation 'org.springframework.boot:spring-boot-starter-data-redis'

		//email
		implementation 'javax.mail:mail:1.4.7'
		// Spring Context Support
		implementation 'org.springframework:spring-context-support:5.3.9'



		//s3
		implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.1.RELEASE'
		//mongo
		implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
		//kafka
		implementation 'org.springframework.kafka:spring-kafka'

		//opensearch
		implementation 'com.fasterxml.jackson.core:jackson-core:2.17.0'
		implementation 'org.opensearch.client:spring-data-opensearch:1.4.0'

		//swagger
		implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'

	}

	jar.enabled = true
	bootJar.enabled = false

}










